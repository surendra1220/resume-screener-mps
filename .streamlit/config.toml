[theme]
primaryColor = "#18181b"
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#f4f4f5"
textColor = "#18181b"
font = "sans serif"

[server]
maxUploadSize = 10
maxMessageSize = 20
enableXsrfProtection = true
enableCORS = true
headless = true
disconnectedSessionTTL = 120

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
