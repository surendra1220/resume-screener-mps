[theme]
font = "sans serif"

[theme.light]
primaryColor = "#18181b"
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#f4f4f5"
textColor = "#18181b"

[theme.dark]
primaryColor = "#e4e4e7"
backgroundColor = "#09090b"
secondaryBackgroundColor = "#18181b"
textColor = "#fafafa"

[theme.light.sidebar]
backgroundColor = "#f4f4f5"
secondaryBackgroundColor = "#ffffff"

[theme.dark.sidebar]
backgroundColor = "#111113"
secondaryBackgroundColor = "#18181b"

[server]
maxUploadSize = 10
maxMessageSize = 20
enableXsrfProtection = true
enableCORS = true
headless = true
disconnectedSessionTTL = 120

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
